  "source_physical_identity_description": "<p>The dataset accompanies the Journal of Energy Storage publication by Shuquan Wang et al. (2024), Accurate state-of-charge estimation for sodium-ion batteries based on a low-complexity model with hierarchical learning, DOI 10.1016/j.est.2024.112571.&nbsp;</p>\n<h2><strong>Experimental Description:</strong></h2>\n<p>The dataset comprises results from two experimental tests: pulse testing and driving cycle testing. These tests were conducted on two types of sodium-ion batteries&mdash;one with a capacity of 3.2 Ah (battery numbers: 1, 2, and 5) and another with a capacity of 10 Ah (battery numbers: 3, 4, and 6).</p>\n<h3><strong>Pulse Testing:</strong></h3>\n<p>The pulse tests were carried out using a battery test platform, consisting of an Arbin battery testing system, a temperature-controlled chamber, and a computer. The tests were performed on two 3.2 Ah and two 10 Ah sodium-ion batteries from Transimage and HiNa, respectively, with a nominal voltage of 3.0 V. The upper and lower cut-off voltages were set at 3.9 V and 1.5 V.</p>\n<p>Enhanced pulse tests were conducted at six different temperatures: -5 ℃, 5 &deg;C, 15 ℃, 25 ℃, 35 ℃, and 45 ℃. The state-of-charge (SOC) was varied in 10% intervals, with pulse currents escalating incrementally from 0.25C to 3C at 0.25C intervals. Each pulse lasted for 5 seconds, followed by a 15-second rest. After completing each set of pulses, the current was increased, and the process was repeated with a two-minute pause between sets of pulses.</p>\n<h3><strong>Driving Cycle Testing:</strong></h3>\n<p>The driving cycle tests were designed to simulate real-world driving conditions using various standard test methods, including the Federal Urban Driving Schedule (FUDS), Urban Dynamometer Driving Schedule (UDDS), and Dynamic Stress Test (DST). These tests were performed in a temperature-controlled chamber using both the 3.2 Ah and 10 Ah sodium-ion batteries.</p>\n<p>As with the pulse tests, driving cycle tests were carried out at temperatures of -5 ℃, 5 &deg;C, 15 ℃, 25 ℃, 35 ℃, and 45 ℃. Before each test, the batteries were charged with a 0.5C constant current-constant voltage (CC-CV) charging protocol up to 3.9 V, with a cut-off current of 0.02C. After a 30-minute rest, the driving cycle protocol was performed for seven iterations.</p>\n<h2><strong>File Naming Conventions:</strong></h2>\n<p>The dataset files are named based on the experimental conditions, as follows:</p>\n<ul>\n<li><strong>Pulse_data_tempX_batY</strong>: Data from the pulse tests, where X represents the testing temperature and Y denotes the battery number.</li>\n<li><strong>Driving_cycle_data_tempX_batY</strong>: Data from the driving cycle tests, where X represents the testing temperature and Y denotes the battery number.</li>\n</ul>",
