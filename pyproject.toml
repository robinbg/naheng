[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "naheng"
version = "0.1.0"
description = "Traceable synthetic sodium site research and operations workbench"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy>=2.1,<3", "scipy>=1.14,<2", "pydantic>=2.10,<3", "fastapi>=0.115,<1", "uvicorn>=0.32,<1", "PyYAML>=6,<7", "pyarrow>=18,<23"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]
reference = ["pybamm==25.10.2"]

[project.scripts]
naheng = "naheng.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/naheng"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
